name: API Consulta
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'compose.api.yml'
      - '.github/workflows/api-ci.yml'
permissions:
  contents: read
jobs:
  api:
    name: Contratos e consultas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m unittest discover -s api/tests -v
      - run: docker build -f api/Dockerfile --target runtime -t pdoh_cx_consulta:ci .
