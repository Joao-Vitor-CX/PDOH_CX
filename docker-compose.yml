name: pdoh_cx

services:
  mysql:
    image: mysql:8.4
    container_name: pdoh_cx_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${PDOH_MYSQL_PORT:-3307}:3306"
    volumes:
      - pdoh_cx_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - pdoh_cx_network

  migrate:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      PDOH_DB_USER: ${PDOH_DB_USER:?Defina PDOH_DB_USER no arquivo .env}
      PDOH_DB_PASSWORD: ${PDOH_DB_PASSWORD:?Defina PDOH_DB_PASSWORD no arquivo .env}
      PDOH_MIGRATION_USER: ${PDOH_MIGRATION_USER:?Defina PDOH_MIGRATION_USER no arquivo .env}
      PDOH_MIGRATION_PASSWORD: ${PDOH_MIGRATION_PASSWORD:?Defina PDOH_MIGRATION_PASSWORD no arquivo .env}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "/scripts/run-migrations.sh"]
    volumes:
      - ./docker/mysql/migrations:/migrations:ro
      - ./docker/mysql/scripts:/scripts:ro
    networks:
      - pdoh_cx_network

  backend:
    image: pdoh_cx:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdoh_cx_backend
    environment:
      PDOH_DB_HOST: mysql
      PDOH_DB_PORT: "3306"
      PDOH_DB_USER: ${PDOH_DB_USER:?Defina PDOH_DB_USER no arquivo .env}
      PDOH_DB_PASSWORD: ${PDOH_DB_PASSWORD:?Defina PDOH_DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "src.healthcheck", "--wait"]
    volumes:
      - ./bracell/outputs:/app/outputs
      - ./bracell/logs:/app/logs
    networks:
      - pdoh_cx_network

  pipeline:
    profiles: ["pipeline"]
    image: pdoh_cx:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PDOH_DB_HOST: mysql
      PDOH_DB_PORT: "3306"
      PDOH_DB_USER: ${PDOH_DB_USER:?Defina PDOH_DB_USER no arquivo .env}
      PDOH_DB_PASSWORD: ${PDOH_DB_PASSWORD:?Defina PDOH_DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "run_observado.py"]
    volumes:
      - ./bracell/outputs:/app/outputs
      - ./bracell/logs:/app/logs
    networks:
      - pdoh_cx_network

volumes:
  pdoh_cx_mysql_data:
    name: pdoh_cx_mysql_data

networks:
  pdoh_cx_network:
    name: pdoh_cx_network
    internal: true
